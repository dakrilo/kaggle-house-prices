data:
  train_path: data/train.csv
  test_path: data/test.csv
  target: SalePrice
  id_column: Id
  log_target: true
  drop_ids: [524, 1299]

metric: neg_root_mean_squared_error
n_splits: 5
stratify_bins: 10
seed: 42

output_dir: outputs
results_path: ${output_dir}/results.csv
reports_dir: reports

features:
  numeric: ["OverallQual", "OverallCond", "YearBuilt", "YearRemodAdd", "BsmtFinSF2",
            "BsmtUnfSF", "TotalBsmtSF", "BsmtFullBath", "BsmtHalfBath", "FullBath",
            "HalfBath", "BedroomAbvGr", "KitchenAbvGr", "Fireplaces", "GarageCars",
            "EnclosedPorch", "ScreenPorch", "MoSold", "YrSold",
            "ExterQual", "ExterCond", "BsmtQual", "BsmtCond", "HeatingQC", "KitchenQual",
            "FireplaceQu", "GarageQual", "GarageCond", "BsmtExposure", "BsmtFinType1",
            "BsmtFinType2", "GarageFinish", "Functional", "PavedDrive",
            "Qual2", "HasGarage", "HasBsmt"]
  categorical: ["MSZoning", "Alley", "LotShape", "LandContour", "LotConfig", "LandSlope",
                "Neighborhood", "Condition1", "BldgType", "HouseStyle", "RoofStyle",
                "Exterior1st", "Exterior2nd", "MasVnrType", "Foundation", "CentralAir",
                "Electrical", "GarageType", "Fence", "SaleType", "SaleCondition", "MSSubClass"]
  log_numeric: ["LotArea", "GrLivArea", "1stFlrSF", "2ndFlrSF", "LotFrontage",
                "MasVnrArea", "OpenPorchSF", "WoodDeckSF", "BsmtFinSF1"]

preprocessing:
  encoder: onehot
  scale: true
  fill_none: ["Alley", "Fence", "FireplaceQu",
              "GarageType", "GarageFinish", "GarageQual", "GarageCond",
              "BsmtQual", "BsmtCond", "BsmtExposure", "BsmtFinType1", "BsmtFinType2",
              "MasVnrType"]
  fill_zero: ["MasVnrArea", "BsmtFinSF1", "BsmtFinSF2", "BsmtUnfSF", "TotalBsmtSF",
              "BsmtFullBath", "BsmtHalfBath", "GarageCars"]
  ordinal:
    scales:
      quality: {"None": 0, "Po": 1, "Fa": 2, "TA": 3, "Gd": 4, "Ex": 5}
      exposure: {"None": 0, "No": 1, "Mn": 2, "Av": 3, "Gd": 4}
      fin_type: {"None": 0, "Unf": 1, "LwQ": 2, "Rec": 3, "BLQ": 4, "ALQ": 5, "GLQ": 6}
      garage_finish: {"None": 0, "Unf": 1, "RFn": 2, "Fin": 3}
      functional: {"Sal": 0, "Sev": 1, "Maj2": 2, "Maj1": 3, "Mod": 4, "Min2": 5, "Min1": 6, "Typ": 7}
      paved: {"N": 0, "P": 1, "Y": 2}
    columns:
      ExterQual: quality
      ExterCond: quality
      BsmtQual: quality
      BsmtCond: quality
      HeatingQC: quality
      KitchenQual: quality
      FireplaceQu: quality
      GarageQual: quality
      GarageCond: quality
      BsmtExposure: exposure
      BsmtFinType1: fin_type
      BsmtFinType2: fin_type
      GarageFinish: garage_finish
      Functional: functional
      PavedDrive: paved

model:
  name: voting
  members: [lasso, mlp, xgb]
  params: {}

tuning:
  n_trials: 40
  space:
    catboost:
      iterations: {type: int, low: 500, high: 3000, step: 250}
      learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
      depth: {type: int, low: 3, high: 7}
      l2_leaf_reg: {type: float, low: 1, high: 20, log: true}
      rsm: {type: float, low: 0.3, high: 1.0}
    lasso:
      alpha: {type: float, low: 0.00005, high: 0.005, log: true}
    lgbm:
      n_estimators: {type: int, low: 500, high: 3000, step: 250}
      learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
      num_leaves: {type: int, low: 4, high: 32}
      min_child_samples: {type: int, low: 5, high: 50}
      colsample_bytree: {type: float, low: 0.2, high: 0.8}
      reg_lambda: {type: float, low: 0.001, high: 10, log: true}
    xgb:
      n_estimators: {type: int, low: 500, high: 3000, step: 250}
      learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
      max_depth: {type: int, low: 2, high: 6}
      min_child_weight: {type: int, low: 1, high: 10}
      colsample_bytree: {type: float, low: 0.2, high: 0.8}
      reg_lambda: {type: float, low: 0.001, high: 10, log: true}
    mlp:
      n_layers: {type: int, low: 1, high: 3}
      hidden_size: {type: int, low: 32, high: 256, step: 32}
      dropout: {type: float, low: 0.1, high: 0.5}
      weight_decay: {type: float, low: 0.00001, high: 0.1, log: true}
      lr: {type: float, low: 0.0001, high: 0.01, log: true}
      epochs: {type: int, low: 50, high: 300, step: 50}
      optimizer: {type: categorical, choices: ["adam", "adamw", "sgd"]}
      activation: {type: categorical, choices: ["relu", "gelu"]}
      batchnorm: {type: categorical, choices: [true, false]}
  fixed:
    catboost: {random_state: "${seed}", verbose: 0}
    lasso: {max_iter: 20000}
    lgbm: {subsample: 0.8, subsample_freq: 1, random_state: "${seed}", verbose: -1}
    xgb: {subsample: 0.8, random_state: "${seed}"}
    mlp: {batch_size: 64, random_state: "${seed}"}


tuned:
  catboost: {iterations: 2250, learning_rate: 0.035, depth: 3, l2_leaf_reg: 15.3,
             rsm: 0.81, random_state: "${seed}", verbose: 0}
  lgbm: {n_estimators: 1000, learning_rate: 0.0174, num_leaves: 6, min_child_samples: 7,
         colsample_bytree: 0.2, reg_lambda: 0.024, subsample: 0.8, subsample_freq: 1,
         random_state: "${seed}", verbose: -1}
  xgb: {n_estimators: 2000, learning_rate: 0.028, max_depth: 3, min_child_weight: 3,
        colsample_bytree: 0.2, reg_lambda: 0.73, subsample: 0.8, random_state: "${seed}"}
  mlp: {n_layers: 1, hidden_size: 256, dropout: 0.35, weight_decay: 0.0065,
        lr: 0.0064, epochs: 200, optimizer: "sgd", activation: "gelu",
        batchnorm: false, batch_size: 64, random_state: "${seed}"}
  lasso: {alpha: 0.00041, max_iter: 20000}